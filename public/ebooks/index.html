<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ebooks Grindrise</title>
  </head>
  <body>
    <!-- Page volontairement non designée : le design est le chantier suivant,
         une fois le flow de paiement prouvé de bout en bout. -->
    <h1>Guide d'entraînement Grindrise</h1>
    <p>Le programme complet pour structurer sa progression.</p>
    <p><strong>19,90 €</strong></p>

    <!-- La page de paiement PayPlug ne demande pas l'email : c'est ici qu'on le
         collecte, et c'est là que partira le lien de téléchargement. -->
    <form id="achat">
      <label for="email">Email de réception de l'ebook</label>
      <input id="email" name="email" type="email" autocomplete="email" required maxlength="255" />
      <button id="acheter" type="submit">Acheter</button>
    </form>
    <p id="erreur" role="alert" hidden></p>

    <script>
      const formulaire = document.getElementById('achat');
      const bouton = document.getElementById('acheter');
      const champEmail = document.getElementById('email');
      const erreur = document.getElementById('erreur');

      formulaire.addEventListener('submit', async (evenement) => {
        evenement.preventDefault();
        // Désactiver pendant l'appel : un double clic créerait deux paiements
        // PayPlug, donc deux commandes pour un seul acheteur.
        bouton.disabled = true;
        erreur.hidden = true;

        try {
          const reponse = await fetch('/api/checkout', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ productId: 'entrainement', email: champEmail.value }),
          });

          if (!reponse.ok) throw new Error('Paiement indisponible');
          const { url } = await reponse.json();
          window.location.assign(url);
        } catch {
          erreur.textContent = 'Le paiement est momentanément indisponible. Réessayez.';
          erreur.hidden = false;
          bouton.disabled = false;
        }
      });
    </script>
  </body>
</html>
